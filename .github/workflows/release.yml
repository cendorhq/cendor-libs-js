name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# Least privilege per job: `verify` only reads the repo; only `release` may write and mint an OIDC
# token. Declared per job rather than at the workflow level so the gate can never publish.
permissions:
  contents: read

jobs:
  # THE PUBLISH GATE. `ci.yml` and this workflow are both `push: main` triggers, so before this job
  # existed they ran independently and a RED CI still published — measured on commit 00930d6, which
  # failed CI and shipped to npm in the same push. This job re-runs the exact same install + build
  # (typecheck) + type-tests + lint + major-approval + test steps as `ci.yml`, on the same Node
  # matrix, and `release` declares `needs: verify` — so npm is now downstream of a green build. It
  # deliberately duplicates `ci.yml` rather than using `workflow_run`: a `workflow_run` trigger runs
  # in a separate event whose head can differ from the commit that was tested, which is a race on a
  # publishing workflow. Keep the two step lists in sync; if you add a gate to `ci.yml`, add it here.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck + build
        run: pnpm build
      - name: Type Teach regression (decoy overloads still error)
        run: pnpm check:types
      - name: Lint
        run: pnpm lint
      # A MAJOR is irreversible on npm and re-frames the product for every reader. It is never an
      # autonomous decision: a major changeset must carry an in-band `Approved-Major:` line.
      - name: a major bump needs explicit approval
        run: pnpm check:major
      - name: Test (no network — committed conformance vectors)
        run: pnpm test

  release:
    needs: verify # nothing reaches npm unless every `verify` matrix leg is green
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version-bump branch + tags
      pull-requests: write # open / update the "Version Packages" PR
      id-token: write # npm provenance via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so changeset publish can tag
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # TWO-STEP RELEASE (the changesets "Version Packages" PR flow). This replaced direct
      # publish-on-push on 2026-07-29 (FLIP-CHECKLIST A4), because on a public repo an accidental push
      # to `main` carrying a changeset WAS a release — no human step between a merge and npm.
      #
      # The action branches on whether changesets are present, so one workflow covers both halves:
      #   1. changesets present  → open/update PR "chore: version packages" on branch
      #                            `changeset-release/main`, which runs `changeset version` there
      #                            (bumping versions + writing CHANGELOGs). NOTHING is published.
      #   2. no changesets, versions already bumped (i.e. that PR was merged)
      #                          → run `changeset publish`: publish the bumped @cendor/* to npm
      #                            (pnpm rewrites workspace:^ into real ranges) and tag each
      #                            `@cendor/<x>@<version>`.
      # So PUBLISHING IS NOW A MERGE, not a push — and `needs: verify` still gates both halves.
      #
      # ⚠️ `version:` MUST be a single command. The action splits this string and execs it WITHOUT a
      # shell, so `a && b` makes `&&` and `b` into ARGUMENTS to `changeset` — measured 2026-07-29:
      # `changeset version && pnpm install --lockfile-only` failed with "Too many arguments passed to
      # changesets", so nothing was versioned, the branch got no commits, and opening the PR then died
      # on "No commits between main and changeset-release/main". If you ever need two steps here, put
      # them in a package.json script (NOT named `version` — that is an npm lifecycle hook) and call
      # that. A lockfile refresh is not needed today: internal ranges are `workspace:^`, so a version
      # bump provably does not touch pnpm-lock.yaml.
      #
      # createGithubReleases is off to preserve existing behaviour — today the npm side ships tags but
      # no GitHub Releases. Turning it on is a reasonable follow-up, not part of this change.
      - name: Version PR, or publish a merged one
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance requires a PUBLIC source repo (sigstore rejects private with E422).
          # These repos are private, so provenance is off; re-enable ("true") once public.
          NPM_CONFIG_PROVENANCE: "false"
