name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # commit the version bump + push tags back to main
  id-token: write # npm provenance via OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history so changeset publish can tag
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Direct publish on push (no Version PR), mirroring the Python release flow: when changesets are
      # present, `changeset version` bumps versions + writes CHANGELOGs, we commit that back to main
      # ([skip ci] so it doesn't re-trigger), then `changeset publish` publishes the bumped @cendor/*
      # packages to npm (pnpm replaces workspace:^ with real ranges) with provenance and tags each
      # `@cendor/<x>@<version>`. A run with no changesets versions nothing and publishes nothing.
      - name: Version + publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm exec changeset version
          git add -A
          git commit -m "chore: version packages [skip ci]" || echo "no version changes to commit"
          pnpm exec changeset publish
          git push --follow-tags origin HEAD:main || echo "nothing to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance requires a PUBLIC source repo (sigstore rejects private with E422).
          # These repos are private, so provenance is off; re-enable ("true") once public.
          NPM_CONFIG_PROVENANCE: "false"
