name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # create the version PR + git tags
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # npm provenance + OIDC trusted publishing (tokenless)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Changesets: when changesets are present, opens/updates a "Version Packages" PR that bumps
      # versions + writes CHANGELOGs. When that PR merges (versions already bumped, no changesets left),
      # `publish` runs and publishes the changed @cendor/* packages to npm.
      #
      # Publishing authenticates with the `NPM_TOKEN` repo secret (an npm **automation** token for the
      # `cendor` org — it can create brand-new packages, so the first release needs no manual bootstrap).
      # `provenance:true` in each package's publishConfig + `id-token: write` attach a provenance
      # attestation via OIDC. Changesets tags each published package `@cendor/<x>@<version>`, so the git
      # tag ≍ the manifest version by construction. (To switch to tokenless trusted publishing later,
      # configure each package's Trusted Publisher on npmjs.com and drop NODE_AUTH_TOKEN — see PUBLISHING.md.)
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
