name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# Least privilege per job: `verify` only reads the repo; only `release` may write and mint an OIDC
# token. Declared per job rather than at the workflow level so the gate can never publish.
permissions:
  contents: read

jobs:
  # THE PUBLISH GATE. `ci.yml` and this workflow are both `push: main` triggers, so before this job
  # existed they ran independently and a RED CI still published — measured on commit 00930d6, which
  # failed CI and shipped to npm in the same push. This job re-runs the exact same install + build
  # (typecheck) + type-tests + lint + major-approval + test steps as `ci.yml`, on the same Node
  # matrix, and `release` declares `needs: verify` — so npm is now downstream of a green build. It
  # deliberately duplicates `ci.yml` rather than using `workflow_run`: a `workflow_run` trigger runs
  # in a separate event whose head can differ from the commit that was tested, which is a race on a
  # publishing workflow. Keep the two step lists in sync; if you add a gate to `ci.yml`, add it here.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck + build
        run: pnpm build
      - name: Type Teach regression (decoy overloads still error)
        run: pnpm check:types
      - name: Lint
        run: pnpm lint
      # A MAJOR is irreversible on npm and re-frames the product for every reader. It is never an
      # autonomous decision: a major changeset must carry an in-band `Approved-Major:` line.
      - name: a major bump needs explicit approval
        run: pnpm check:major
      - name: Test (no network — committed conformance vectors)
        run: pnpm test

  release:
    needs: verify # nothing reaches npm unless every `verify` matrix leg is green
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump + push tags back to main
      id-token: write # npm provenance via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so changeset publish can tag
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Direct publish on push (no Version PR), mirroring the Python release flow: when changesets are
      # present, `changeset version` bumps versions + writes CHANGELOGs, we commit that back to main
      # ([skip ci] so it doesn't re-trigger), then `changeset publish` publishes the bumped @cendor/*
      # packages to npm (pnpm replaces workspace:^ with real ranges) with provenance and tags each
      # `@cendor/<x>@<version>`. A run with no changesets versions nothing and publishes nothing.
      - name: Version + publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm exec changeset version
          git add -A
          git commit -m "chore: version packages [skip ci]" || echo "no version changes to commit"
          pnpm exec changeset publish
          git push --follow-tags origin HEAD:main || echo "nothing to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance requires a PUBLIC source repo (sigstore rejects private with E422).
          # These repos are private, so provenance is off; re-enable ("true") once public.
          NPM_CONFIG_PROVENANCE: "false"
