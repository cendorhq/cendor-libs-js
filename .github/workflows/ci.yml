name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default GITHUB_TOKEN needs only checkout — least privilege for a public repo.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck + build
        run: pnpm build
      - name: Type Teach regression (decoy overloads still error)
        run: pnpm check:types
      - name: Lint
        run: pnpm lint
      # A MAJOR is irreversible on npm and re-frames the product for every reader. It is never an
      # autonomous decision: a major changeset must carry an in-band `Approved-Major:` line.
      - name: a major bump needs explicit approval
        run: pnpm check:major
      - name: Test (no network — committed conformance vectors)
        run: pnpm test
